# ===================================================================
# SHOWROOM PROMOTIONAL OFFERS (FROM CLIENT PROMO BANNER - PAGE 38)
# ===================================================================
# Offer 1: Orders >= Rs. 2000 get Assured Free Gift + Free Branded Round Neck T-Shirt or Shorts
