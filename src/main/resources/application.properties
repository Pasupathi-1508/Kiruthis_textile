# ===================================================================
# CHECKOUT, GST & COD RULES
# ===================================================================
# Apparel GST Rule in India: 5% GST for selling price <= Rs. 1000, 12% GST above Rs. 1000
kiruthis.tax.low-slab-limit=1000.00
kiruthis.tax.low-slab-percent=5.00
kiruthis.tax.high-slab-percent=12.00

# Cash on Delivery (COD) Safeguards
kiruthis.cod.max-order-amount=8000.00
kiruthis.cod.handling-fee=40.00
kiruthis.stock.reservation-timeout-minutes=15

