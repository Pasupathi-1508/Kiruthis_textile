# ===================================================================
# SERVER & APPLICATION SETTINGS
# ===================================================================
spring.application.name=kiruthis-mens-fashions
server.port=8080

# Temporarily disable default security login screen during Step 1 & Step 2 (Removed in Step 3)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# ===================================================================
# MYSQL 8.0 DATABASE CONFIGURATION
# ===================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/kiruthis_fashions_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=Pasu@1150
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Automatically run schema.sql and data.sql on startup
spring.sql.init.mode=always

