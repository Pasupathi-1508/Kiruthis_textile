<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Showroom Admin Security Gate | KIRUTHIS MENS FASHIONS</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="/css/styles.css" />
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px;">
    <div style="max-width:440px; width:100%; border:1px solid var(--gold-primary); border-radius:24px; background:rgba(10,14,24,0.96); padding:36px; box-shadow:0 25px 80px rgba(0,0,0,0.85);">
        <div style="text-align:center; margin-bottom:24px;">
            <span class="curtain-badge">RESTRICTED STAFF &amp; OWNER PORTAL</span>
            <h1 style="font-family:'Cinzel',serif; font-size:22px; color:var(--gold-light);">SHOWROOM ADMIN LOGIN</h1>
            <p style="font-size:12.5px; color:var(--text-muted); margin-top:4px;">Inventory, New Collection Launch, Customer &amp; MySQL Manager</p>
        </div>

        <div id="admin-err" style="display:none; padding:10px 14px; border-radius:10px; background:rgba(239,68,68,0.2); color:#fca5a5; font-size:13px; margin-bottom:14px;"></div>

        <form class="checkout-form" onsubmit="handleAdminLogin(event)">
            <label style="font-size:12px; color:var(--text-muted);">Admin Username / Email</label>
            <input type="text" id="admin-user" value="admin@kiruthis.in" required />
            <label style="font-size:12px; color:var(--text-muted);">Admin Master Password</label>
            <input type="password" id="admin-pass" value="KiruthisAdmin@2026" required />
            <button type="submit" class="btn-gold-luxury full-width" style="margin-top:12px;">
                🔓 Authenticate &amp; Open Admin Console
            </button>
        </form>

        <div style="margin-top:16px; padding:10px; border-radius:10px; background:rgba(255,255,255,0.03); font-size:11.5px; color:var(--text-muted);">
            Default Credentials (configurable in <code>application.properties</code>):<br/>
            User: <code>admin@kiruthis.in</code> | Pass: <code>KiruthisAdmin@2026</code>
        </div>

        <div style="text-align:center; margin-top:18px; font-size:13px;">
            <a href="/" style="color:var(--gold-light); text-decoration:none;">← Back to Customer Storefront</a>
        </div>
    </div>

    <script>
        async function handleAdminLogin(e) {
            e.preventDefault();
            const res = await fetch('/api/v1/auth/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('admin-user').value,
                    password: document.getElementById('admin-pass').value
                })
            });
            const data = await res.json();
            if (!res.ok) {
                const err = document.getElementById('admin-err');
                err.style.display = 'block';
                err.textContent = data.error || 'Unauthorized';
                return;
            }
            localStorage.setItem('kiruthis_admin_session', JSON.stringify(data));
            window.location.href = '/admin-dashboard.html';
        }
    </script>
</body>
</html>
